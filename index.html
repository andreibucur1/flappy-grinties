<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flappy Grințieș</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <!-- Rezoluție „de artă": 800x600 logic / 4. CSS o mărește fără netezire. -->
    <canvas id="game" width="200" height="150"></canvas>
    <!-- Strat transparent, la rezoluție logică (800x600), pentru pozele personajelor: ca să se vadă clar, nu pixelate la 12x12 -->
    <canvas id="faces" width="800" height="600"></canvas>
    <!-- Muzica: butonul din colțul dreapta-jos deschide sliderul de volum (logica în music.js) -->
    <div id="music-ui">
      <div id="music-panel" hidden>
        <input id="music-volume" type="range" min="0" max="100" step="1" aria-label="Volumul muzicii">
      </div>
      <button id="music-btn" type="button" aria-label="Volumul muzicii" aria-expanded="false" aria-controls="music-panel">
        <svg viewBox="0 0 9 8" aria-hidden="true">
          <rect x="1" y="3" width="2" height="2"/><rect x="3" y="2" width="1" height="4"/><rect x="4" y="1" width="1" height="6"/>
          <g class="waves"><rect x="6" y="3" width="1" height="2"/><rect x="7" y="2" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/><rect x="8" y="3" width="1" height="2"/></g>
          <g class="mute"><rect x="6" y="2" width="1" height="1"/><rect x="8" y="2" width="1" height="1"/><rect x="7" y="3" width="1" height="2"/><rect x="6" y="5" width="1" height="1"/><rect x="8" y="5" width="1" height="1"/></g>
        </svg>
      </button>
    </div>
  </div>
  <!-- Câmp real, transparent, pus de ui.js exact peste câmpul desenat (pe telefon, atingerea lui deschide tastatura);
       textul se desenează pe canvas cu fontul bitmap -->
  <input id="name-input" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="go" maxlength="12" aria-label="Username">

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/music.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
